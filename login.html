<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Panel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
        }

       
        

         
        
        /* Main content */
        .main-content {
            flex: 1;
            padding: 35px;
        }

      
        /* Login form */
        .login-container {
            max-width: 450px;
            width: 100%;
            margin: 45px auto;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .login-icon {
            width: 65px;
            height: 65px;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 26px;
        }

        .description {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #4f46e5;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 22px;
            font-size: 13px;
            color: #4f46e5;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-button {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .login-button:hover {
            background: #3730a3;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #64748b;
        }

        .register-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .divider {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 22px 0;
        }

        .back-link {
            text-align: center;
        }

        .back-link a {
            color: #4f46e5;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
           

            .main-content {
                padding: 18px;
            }
 

            .login-container {
                margin: 25px auto;
            }

            .login-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

 
    <!-- Main content -->
    <main class="main-content">

       

        <div class="login-container">
            <section class="login-card">

                <div class="login-icon">👤</div>

                <h2>Welcome Back!</h2>

                <p class="description">
                    Please enter your account details to access your admin panel.
                </p>

                <form action="#" method="post">

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <a href="forgotpassword.html" class="forgot-password">
                        Forgot Password?
                    </a>

                    <button type="submit" class="login-button">
                        Login
                    </button>

                </form>

                <p class="register-link">
                    Don't have an account?
                    <a href="registration.html">Create an Account</a>
                </p>

                <hr class="divider">

            </section>
        </div>

    </main>

</body>
</html>
